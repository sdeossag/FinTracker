# Recordatorios de corte y pago de tarjetas (notificaciones push).
# Todos los días a las 8:00 a. m. de Colombia (13:00 UTC) le pide al backend
# que envíe los avisos que tocan hoy. Cada aviso sale una sola vez, así que
# correrlo de nuevo a mano ("Run workflow") no manda repetidos.
#
# Necesita en GitHub → Settings → Secrets and variables → Actions:
#   RECORDATORIOS_TOKEN  el mismo valor que la variable de entorno en Render
name: Recordatorios

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar recordatorios
        env:
          TOKEN: ${{ secrets.RECORDATORIOS_TOKEN }}
          API: https://fintracker-5809.onrender.com/api
        run: |
          # Render puede estar despertando: se reintenta con calma
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "X-Cron-Token: $TOKEN" "$API/recordatorios/enviar/"
