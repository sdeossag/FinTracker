<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />

    <!-- Identidad -->
    <title>FinTracker</title>
    <meta name="description" content="Registro financiero personal — controla tus cuentas, presupuesto y transacciones" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/pwa-source.svg" type="image/svg+xml" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- iOS PWA — apple-touch-icon DEBE ser PNG (iOS ignora SVG) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" y no "black-translucent": con translúcida, iOS 26 deja el área visible de
         la app instalada 62 pt más corta que la pantalla (unas veces sí y otras no): queda
         una franja negra abajo y la barra de pestañas se descuadra. Con "black" la app ocupa
         exactamente el espacio bajo la barra de estado (igual que NutriFit).
         iOS lee esta etiqueta solo al instalar: hay que quitar la app y agregarla de nuevo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="FinTracker" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FinTracker" />
  </head>
  <!-- ontouchstart vacío: hace que :active funcione al tocar en iOS Safari -->
  <body ontouchstart="">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
