app = "fintracker-api"
primary_region = "mia"

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/buildpacks/google/python"]

[env]
  PORT = "8080"
  DJANGO_SETTINGS_MODULE = "fintracker_backend.settings"

[processes]
  app = "gunicorn fintracker_backend.wsgi:application --bind 0.0.0.0:8080 --workers 2 --timeout 60"
  release = "python manage.py migrate --noinput"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    path = "/api/token/"
    method = "GET"
